name: GoCath Tagging POC
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Regular classification or read-only latency probe
        options:
          - classify
          - latency
          - compare-groq
          - compare-input
        default: classify
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Classify events and update test sheet
        if: inputs.mode == 'classify'
        env:
          GOCATH_GEMINI_CLASSIFIER_KEY: ${{ secrets.GOCATH_GEMINI_CLASSIFIER_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
        run: python -m src.main
      - name: Probe Gemini latency without writing results
        if: inputs.mode == 'latency'
        env:
          GOCATH_GEMINI_CLASSIFIER_KEY: ${{ secrets.GOCATH_GEMINI_CLASSIFIER_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
        run: python -m src.latency_probe --rounds 3
      - name: Compare Groq and Gemini without writing results
        if: inputs.mode == 'compare-groq'
        env:
          GOCATH_GEMINI_CLASSIFIER_KEY: ${{ secrets.GOCATH_GEMINI_CLASSIFIER_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
        run: python -m src.groq_compare --limit 10
      - name: Compare old and compact Decisions inputs (read-only)
        if: inputs.mode == 'compare-input'
        env:
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
        run: python -m src.input_probe --limit 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-results
          path: |
            output/results.json
            output/latency-probe.json
            output/groq-comparison.json
            output/input-probe.json
            output/failed-groq-request-response.json
          if-no-files-found: ignore
