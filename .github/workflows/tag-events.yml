name: GoCath Tagging POC
on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of events (1–50)'
        required: true
        default: '2'
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Classify events and update test sheet
        env:
          GOCATH_GEMINI_CLASSIFIER_KEY: ${{ secrets.GOCATH_GEMINI_CLASSIFIER_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
          LIMIT: ${{ inputs.limit || '2' }}
        run: python -m src.main --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-results
          path: output/results.json
          if-no-files-found: ignore
