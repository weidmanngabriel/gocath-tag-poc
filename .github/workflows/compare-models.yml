name: Compare Gemini and Gemma (manual)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Public events to compare (max 10)
        required: false
        default: '10'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Compare fixed models without writing results to Sheets
        env:
          GOCATH_GEMINI_CLASSIFIER_KEY: ${{ secrets.GOCATH_GEMINI_CLASSIFIER_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: 1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w
          EVENT_LIMIT: ${{ inputs.limit }}
        run: python -m src.benchmark --limit "$EVENT_LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-gemma-ab-results
          path: output/ab-results.*
          if-no-files-found: ignore
