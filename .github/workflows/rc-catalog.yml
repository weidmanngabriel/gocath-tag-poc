name: RC Catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish-questions, delta, reclassify, continue]
        default: delta
permissions:
  contents: write
concurrency:
  group: rc-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore previous data
        run: |
          git fetch origin rc-data:refs/remotes/origin/rc-data || true
          mkdir -p state
          git show origin/rc-data:catalog.json > state/catalog.json 2>/dev/null || rm -f state/catalog.json
