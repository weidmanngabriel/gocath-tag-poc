name: RC Catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish-questions, delta, refresh, reclassify, continue]
        default: delta
      max_paid:
        default: '25'
      confirm:
        default: ''
permissions:
  contents: write
concurrency:
  group: rc-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore previous data
        run: |
          git fetch origin rc-data:refs/remotes/origin/rc-data || true
          mkdir -p state
          git show origin/rc-data:catalog.json > state/catalog.json 2>/dev/null || rm -f state/catalog.json
      - name: Run RC catalog pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: '1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w'
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          RC_MODE: ${{ inputs.mode }}
          RC_LIMIT: ${{ inputs.max_paid }}
          RC_CONFIRM: ${{ inputs.confirm }}
        run: |
          python -m src.rc_runtime --mode "$RC_MODE" --max-paid "$RC_LIMIT" --confirm "$RC_CONFIRM" --state state/catalog.json --public public/catalog.json
      - name: Publish durable RC branch
        run: |
          cp state/catalog.json "$RUNNER_TEMP/rc-state.json"
          cp public/catalog.json "$RUNNER_TEMP/rc-public.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --quiet refs/remotes/origin/rc-data; then
            git switch -C rc-data origin/rc-data
          else
            git switch --orphan rc-data
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/rc-state.json" catalog.json
          cp "$RUNNER_TEMP/rc-public.json" public.json
          git add catalog.json public.json
          git diff --cached --quiet || (git commit -m 'Update RC catalog' && git push origin HEAD:rc-data)
