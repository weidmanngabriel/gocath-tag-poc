name: RC Catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish-questions, delta, reclassify, continue]
        default: delta
permissions:
  contents: write
concurrency:
  group: rc-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore previous data
        run: |
          git fetch origin rc-data:refs/remotes/origin/rc-data || true
          mkdir -p state
          git show origin/rc-data:catalog.json > state/catalog.json 2>/dev/null || rm -f state/catalog.json
      - name: Run RC catalog pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: '1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w'
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          RC_MODE: ${{ inputs.mode }}
          RC_LIMIT: ${{ inputs.max_paid }}
          RC_CONFIRM: ${{ inputs.confirm }}
        run: |
          python -m src.rc_runtime --mode "$RC_MODE" --max-paid "$RC_LIMIT" --confirm "$RC_CONFIRM" --state state/catalog.json --public public/catalog.json
