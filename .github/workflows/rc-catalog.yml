name: RC Catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish-questions, delta, refresh, reclassify, continue]
        default: delta
      max_paid:
        default: '25'
permissions:
  contents: write
concurrency:
  group: rc-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore previous data
        run: |
          git fetch origin rc-data:refs/remotes/origin/rc-data || true
          mkdir -p state
          git show origin/rc-data:catalog.json > state/catalog.json 2>/dev/null || rm -f state/catalog.json
      - name: Run RC catalog pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: '1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w'
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          RC_MODE: ${{ github.event_name == 'schedule' && 'delta' || inputs.mode }}
          RC_LIMIT: ${{ github.event_name == 'schedule' && '25' || inputs.max_paid }}
        run: |
          python -m src.rc_runtime --mode "$RC_MODE" --max-paid "$RC_LIMIT" --state state/catalog.json --public public/catalog.json
      - name: Publish durable RC branch
        run: |
          if [ -f state/catalog.json ]; then cp state/catalog.json "$RUNNER_TEMP/rc-state.json"; fi
          if [ -f public/catalog.json ]; then cp public/catalog.json "$RUNNER_TEMP/rc-public.json"; fi
          if [ -f state/rc-run-record.json ]; then cp state/rc-run-record.json "$RUNNER_TEMP/rc-run-record.json"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --quiet refs/remotes/origin/rc-data; then
            git switch -C rc-data origin/rc-data
          else
            git switch --orphan rc-data
            git rm -rf --ignore-unmatch .
          fi
          if [ ! -f state/rc-no-changes.flag ]; then
            cp "$RUNNER_TEMP/rc-state.json" catalog.json
            cp "$RUNNER_TEMP/rc-public.json" public.json
            git add catalog.json public.json
          fi
          if [ -f "$RUNNER_TEMP/rc-run-record.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path=Path("runs.json")
          prior=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"runs":[]}
          record=json.loads(Path(__import__("os").environ["RUNNER_TEMP"],"rc-run-record.json").read_text(encoding="utf-8"))
          prior["runs"]=[x for x in prior.get("runs",[]) if x.get("run_id")!=record["run_id"]]
          prior["runs"].append(record)
          prior["runs"]=prior["runs"][-1000:]
          path.write_text(json.dumps(prior,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git add runs.json
          fi
          git diff --cached --quiet || (git commit -m 'Update RC catalog' && git push origin HEAD:rc-data)
