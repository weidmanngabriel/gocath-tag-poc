name: RC Catalog
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [delta, reclassify, refresh]
        default: delta
      max_paid:
        default: '200'
permissions:
  contents: write
concurrency:
  group: rc-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: RC sync with durable ten-event checkpoints
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: '1HRyxPjLz2-WUEelplO1YAaO7gCYDyU_77DgUqEtGQ1w'
          GOCATH_OPENAI: ${{ secrets.GOCATH_OPENAI }}
          RC_MODE: ${{ github.event_name == 'schedule' && 'delta' || inputs.mode }}
          RC_LIMIT: ${{ github.event_name == 'schedule' && '25' || inputs.max_paid }}
        run: bash scripts/rc_checkpoint_run.sh
